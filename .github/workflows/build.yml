name: Build iOS IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install Ionic & Capacitor CLI
        run: |
          npm install -g @ionic/cli @capacitor/cli
          npm install
          
      - name: Build Web Assets & Sync
        run: |
          npx cap init "Magics App" "com.mquang.magicsapp" --web-dir www --yes || true
          npx cap sync ios || true
          
      - name: Compile and Archive Project
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          else
            echo "iOS folder not found, skipping build"
            exit 1
          fi
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r MagicsApp.zip Payload/
          mv MagicsApp.zip MagicsApp.ipa
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-ipa
          path: MagicsApp.ipa
