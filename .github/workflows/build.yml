name: Build iOS IPA

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install Dependencies & CLI
        run: |
          npm install
          npm install -g @capacitor/cli @capacitor/core @capacitor/ios
          
      - name: Create Capacitor Config
        run: |
          npx cap init "Magics App" "com.mquang.magicsapp" --web-dir www --yes
          npx cap add ios
          npx cap sync ios
          
      - name: Build iOS App Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Export IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r MagicsApp.zip Payload/
          mv MagicsApp.zip MagicsApp.ipa
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-ipa
          path: MagicsApp.ipa
